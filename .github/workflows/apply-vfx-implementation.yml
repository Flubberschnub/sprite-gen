# SPDX-License-Identifier: Apache-2.0
# Temporary, integrity-checked transport of the locally tested implementation.
# This workflow and its payload remove themselves in the resulting feature commit.
name: Apply tested VFX implementation
on:
  push:
    branches: [feat/vfx-flipbooks]
    paths: ['.github/vfx-patch/**']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Flubberschnub/sprite-gen' && github.ref == 'refs/heads/feat/vfx-flipbooks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify and apply the reviewed patch
        run: |
          cat .github/vfx-patch/part*.b64 | base64 --decode | xz --decompress > /tmp/vfx-implementation.patch
          echo '3fb53183eed8a672468668bc27680623947ebe3f6b55c5b280815ded7904a8a7  /tmp/vfx-implementation.patch' | sha256sum --check
          git apply --check /tmp/vfx-implementation.patch
          git apply --index /tmp/vfx-implementation.patch
      - name: Install and test VFX plus character regressions
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m pytest -q tests/vfx tests/test_subject_profile.py tests/frames/test_extraction_golden.py tests/gen/test_gen_set.py tests/packaging/test_pipeline_smoke.py tests/packaging/test_cli_taxonomy.py tests/docs
      - name: Publish feature commit and remove temporary tooling
        run: |
          git rm -r .github/vfx-patch .github/workflows/apply-vfx-implementation.yml .github/workflows/vfx-validation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add fixed-origin VFX generation, alpha policies and flipbook export'
          git push origin HEAD:refs/heads/feat/vfx-flipbooks
