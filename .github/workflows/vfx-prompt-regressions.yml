# SPDX-License-Identifier: Apache-2.0
name: VFX prompt regressions

on:
  pull_request:
    paths:
      - 'sprite_gen/gen/**'
      - 'sprite_gen/spec/vfx.py'
      - 'tests/vfx/**'
      - 'docs/vfx-flipbooks.md'
      - '.github/workflows/vfx-prompt-regressions.yml'

permissions:
  contents: read

jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Test prompts, VFX pipeline and character generation regressions
        run: .venv/bin/python -m pytest -q tests/vfx tests/gen/test_gen_set.py tests/test_subject_profile.py
