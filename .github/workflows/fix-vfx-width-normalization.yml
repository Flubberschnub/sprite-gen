name: Apply VFX width normalization integration

on:
  push:
    branches: [feat/vfx-flipbooks]
    paths: ['.github/workflows/fix-vfx-width-normalization.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Flubberschnub/sprite-gen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Wire normalization into VFX extraction
        shell: python
        run: |
          from pathlib import Path

          path = Path('sprite_gen/frames/extract.py')
          text = path.read_text(encoding='utf-8')
          old = '''                frames, geometry = vfx_frames.split_frames(strip, frame_count,
                    (cell_width, cell_height), vfx_config, fit_config.get("resample"))
                # A letterbox must not hide source clipping. Inspect slot edges
'''
          new = '''                strip, width_geometry = vfx_frames.normalize_strip_width(
                    strip, frame_count, vfx_config, fit_config.get("resample"))
                frames, geometry = vfx_frames.split_frames(strip, frame_count,
                    (cell_width, cell_height), vfx_config, fit_config.get("resample"))
                geometry.update(width_geometry)
                # A letterbox must not hide source clipping. Inspect slot edges
'''
          if old not in text:
              raise SystemExit('expected VFX extraction snippet was not found; refusing an ambiguous edit')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Install and test
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m pytest -q tests/vfx
      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-vfx-width-normalization.yml
          git add sprite_gen/frames/extract.py sprite_gen/frames/vfx_frames.py tests/vfx/test_generated_width_normalization.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: normalize AI VFX strip widths before extraction'
          git push origin HEAD:refs/heads/feat/vfx-flipbooks
