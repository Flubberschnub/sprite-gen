name: Apply VFX width normalization integration

on:
  push:
    branches: [feat/vfx-flipbooks]
    paths: ['.github/workflows/fix-vfx-width-normalization.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Flubberschnub/sprite-gen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Wire normalization into VFX extraction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sprite_gen/frames/extract.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if 'frames, geometry = vfx_frames.split_frames(strip, frame_count,' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one VFX primary split call, found {len(matches)}')
          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index:index] = [
              indent + 'strip, width_geometry = vfx_frames.normalize_strip_width(',
              indent + '    strip, frame_count, vfx_config, fit_config.get("resample"))',
          ]
          # The original split call and its continuation moved down by two lines.
          lines.insert(index + 4, indent + 'geometry.update(width_geometry)')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Install and test
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m pytest -q tests/vfx
      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-vfx-width-normalization.yml
          git add sprite_gen/frames/extract.py sprite_gen/frames/vfx_frames.py tests/vfx/test_generated_width_normalization.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: normalize AI VFX strip widths before extraction'
          git push origin HEAD:refs/heads/feat/vfx-flipbooks
