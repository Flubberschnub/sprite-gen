# SPDX-License-Identifier: Apache-2.0
name: VFX validation

on:
  push:
    branches: [feat/vfx-flipbooks]
  pull_request:
    paths:
      - 'sprite_gen/**'
      - 'tests/**'
      - '.github/workflows/vfx-validation.yml'

permissions:
  contents: read

jobs:
  vfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: VFX regression tests
        run: |
          if [ -d tests/vfx ]; then
            .venv/bin/python -m pytest -q tests/vfx
          else
            echo 'VFX tests will be added with the implementation.'
          fi
      - name: Package validation sources (no credentials or local settings)
        if: always()
        run: |
          tar -czf validation-sources.tar.gz sprite_gen scripts tests docs pyproject.toml SKILL.md README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-validation-sources
          path: validation-sources.tar.gz
          retention-days: 7
